# ============================================================================
# INVOICE EXTRACTION SYSTEM 2026 - MODEL CONFIGURATION
# ============================================================================
# Configuration for 2026 models: Sarvam Vision, DeepSeek-OCR 2,
# PaddleOCR-VL 1.5, and Qwen3-VL
# Updated: February 16, 2026
# ============================================================================

# -----------------------------------------------------------------------------
# PROJECT METADATA
# -----------------------------------------------------------------------------
project:
  name: "Invoice Extraction System 2026"
  version: "2.0.0"
  description: "Production-ready invoice extraction using 2026 state-of-the-art VLM models"
  author: "ML Engineering Team"

# -----------------------------------------------------------------------------
# MODEL CONFIGURATION (2026 MODELS)
# -----------------------------------------------------------------------------
models:
  # Primary model: Sarvam Vision 3B
  sarvam_vision:
    enabled: true
    role: "primary"
    api_url: "https://api.sarvam.ai/vision/document"
    api_key_env: "SARVAM_API_KEY"
    model_name: "sarvam-vision-3b"
    parameters: "3B"
    max_tokens: 4096
    temperature: 0.05
    timeout: 30
    retry_count: 3
    retry_delay: 2

  # Verification model: DeepSeek-OCR 2
  deepseek_ocr2:
    enabled: true
    role: "verification"
    model_path: "deepseek-ai/DeepSeek-OCR-2"
    local_dir: "models/deepseek-ocr2"
    parameters: "3B"
    max_new_tokens: 2048
    base_size: 1024
    image_size: 768
    crop_mode: true
    device: "auto"  # auto, cpu, cuda
    dtype: "bfloat16"  # float32, float16, bfloat16
    use_flash_attention: true

  # Fallback model: PaddleOCR-VL 1.5
  paddleocr_vl:
    enabled: true
    role: "fallback"
    use_angle_cls: true
    default_lang: "en"
    use_gpu: true
    show_log: false
    enable_structure: true

  # Optional: Qwen3-VL for very long documents
  qwen3_vl:
    enabled: false
    role: "long_document"
    model_path: "Qwen/Qwen3-VL-8B"
    local_dir: "models/qwen3-vl"
    parameters: "8B"
    max_context: 262144  # 256K tokens
    device: "auto"
    dtype: "bfloat16"

# -----------------------------------------------------------------------------
# MODEL ROUTING CONFIGURATION
# -----------------------------------------------------------------------------
routing:
  # Quality-based routing
  quality_threshold_high: 0.8
  quality_threshold_low: 0.5

  # Page count routing
  multipage_threshold: 5
  long_document_threshold: 50

  # Strategy: "quality_based", "always_primary", "ensemble"
  strategy: "quality_based"

  # Cross-model verification
  verify_critical_fields: true
  critical_fields:
    - "invoice_number"
    - "total_amount"
    - "invoice_date"

# -----------------------------------------------------------------------------
# EXTRACTION CONFIGURATION
# -----------------------------------------------------------------------------
extraction:
  # Fields to extract
  header_fields:
    invoice_number:
      question: "What is the invoice number?"
      criticality: "important"
      format_regex: "^[A-Za-z0-9\\-/\\.#]+$"
    invoice_date:
      question: "What is the invoice date?"
      criticality: "important"
      format: "date"
    due_date:
      question: "What is the payment due date?"
      criticality: "important"
      format: "date"
    vendor_name:
      question: "What is the vendor or seller company name?"
      criticality: "normal"
    vendor_address:
      question: "What is the vendor or seller address?"
      criticality: "normal"
    vendor_email:
      question: "What is the vendor email address?"
      criticality: "normal"
      format: "email"
    vendor_phone:
      question: "What is the vendor phone number?"
      criticality: "normal"
      format: "phone"
    customer_name:
      question: "What is the customer or buyer name?"
      criticality: "normal"
    customer_address:
      question: "What is the customer or buyer address?"
      criticality: "normal"
    currency:
      question: "What currency is used in this invoice?"
      criticality: "normal"
    subtotal:
      question: "What is the subtotal amount before tax?"
      criticality: "critical"
      format: "amount"
    tax_amount:
      question: "What is the tax amount?"
      criticality: "critical"
      format: "amount"
    shipping:
      question: "What is the shipping or delivery charge?"
      criticality: "normal"
      format: "amount"
    total_amount:
      question: "What is the total amount due?"
      criticality: "critical"
      format: "amount"

  # Line item fields
  line_item_fields:
    - "line_number"
    - "item_code"
    - "description"
    - "quantity"
    - "unit_price"
    - "tax_rate"
    - "tax_amount"
    - "discount"
    - "line_total"

  # Prompt template for 2026 models
  prompt_template: |
    You are an expert invoice data extraction system. Extract ALL information from this invoice image.

    CRITICAL RULES (Hallucination Prevention):
    1. Provide confidence score (0-100) for EVERY field
    2. If confidence < 85, mark as "uncertain": true
    3. NEVER guess - express uncertainty instead
    4. Verify all calculations before outputting
    5. If a field is not visible, set value to null with confidence 0

    Extract to this exact JSON structure:
    {
      "header": {
        "invoice_number": {"value": "...", "confidence": 0-100},
        "invoice_date": {"value": "YYYY-MM-DD", "confidence": 0-100},
        "due_date": {"value": "YYYY-MM-DD or null", "confidence": 0-100},
        "vendor_name": {"value": "...", "confidence": 0-100},
        "vendor_address": {"value": "...", "confidence": 0-100},
        "vendor_email": {"value": "...", "confidence": 0-100},
        "vendor_phone": {"value": "...", "confidence": 0-100},
        "customer_name": {"value": "...", "confidence": 0-100},
        "customer_address": {"value": "...", "confidence": 0-100},
        "currency": {"value": "USD/EUR/etc", "confidence": 0-100},
        "subtotal": {"value": 0.00, "confidence": 0-100},
        "tax_amount": {"value": 0.00, "confidence": 0-100},
        "shipping": {"value": 0.00, "confidence": 0-100},
        "total_amount": {"value": 0.00, "confidence": 0-100}
      },
      "line_items": [
        {
          "line_number": 1,
          "item_code": {"value": "...", "confidence": 0-100},
          "description": {"value": "...", "confidence": 0-100},
          "quantity": {"value": 0, "confidence": 0-100},
          "unit_price": {"value": 0.00, "confidence": 0-100},
          "tax_rate": {"value": 0.00, "confidence": 0-100},
          "tax_amount": {"value": 0.00, "confidence": 0-100},
          "discount": {"value": 0.00, "confidence": 0-100},
          "line_total": {"value": 0.00, "confidence": 0-100}
        }
      ]
    }

# -----------------------------------------------------------------------------
# ANTI-HALLUCINATION VALIDATION (6-LAYER FRAMEWORK)
# -----------------------------------------------------------------------------
validation:
  # Layer 1: RAG-Based Validation
  rag:
    enabled: true
    vendor_db_path: "data/vendor_patterns.json"
    similarity_threshold: 0.75
    top_k: 5

  # Layer 2: Multi-Agent Validation
  multi_agent:
    enabled: true
    consensus_threshold: 0.75  # 3/4 agents must agree
    agents:
      numerical:
        enabled: true
        tolerance: 0.01  # $0.01 tolerance for math checks
      format:
        enabled: true
      logical:
        enabled: true
      confidence:
        enabled: true
        min_score: 0.85

  # Layer 3: Q-A-E Validation
  qae:
    enabled: true
    consistency_threshold: 0.90
    critical_fields_only: true
    verification_model: "deepseek_ocr2"

  # Layer 4: Neurosymbolic Rules
  neurosymbolic:
    enabled: true
    rules:
      line_items_sum: true
      total_calculation: true
      quantities_positive: true
      prices_non_negative: true
      date_not_future: true
      invoice_number_format: true
      tax_reasonable: true  # 0-25% of subtotal

  # Layer 5: Calibrated Confidence Scoring
  confidence:
    enabled: true
    thresholds:
      critical:
        auto_accept: 0.98
        review: 0.90
        reject: 0.75
      important:
        auto_accept: 0.95
        review: 0.85
        reject: 0.70
      normal:
        auto_accept: 0.90
        review: 0.80
        reject: 0.65

  # Layer 6: Cross-Model Consistency
  cross_model:
    enabled: true
    min_agreement: 0.90
    models_to_compare: 2  # Use 2 models minimum
    voting_strategy: "majority"  # majority, unanimous, weighted

# -----------------------------------------------------------------------------
# PREPROCESSING CONFIGURATION (2026 ENHANCED)
# -----------------------------------------------------------------------------
preprocessing:
  # Image quality assessment
  quality:
    min_score: 0.3
    assess_noise: true
    assess_blur: true
    assess_contrast: true

  # Deskew
  deskew:
    enabled: true
    max_angle: 45
    angle_threshold: 0.3  # Minimum angle to trigger deskew

  # Denoising
  denoise:
    enabled: true
    noise_threshold: 0.3
    method: "adaptive"  # adaptive, gaussian, bilateral

  # Enhancement
  enhance:
    enabled: true
    contrast: true
    sharpness: true
    region_aware: true

  # Table enhancement
  table:
    border_enhancement: true
    borderless_detection: true

  # Watermark
  watermark:
    detection: true
    removal: false  # Set true if needed

# -----------------------------------------------------------------------------
# OUTPUT CONFIGURATION (2026 ENHANCED)
# -----------------------------------------------------------------------------
output:
  # JSON with full metadata
  json:
    enabled: true
    include_validation_report: true
    include_confidence_scores: true
    include_model_metadata: true
    pretty_print: true
    indent: 2

  # Excel with validation sheets
  excel:
    enabled: true
    sheets:
      - "Invoice Headers"
      - "Line Items"
      - "Validation Report"
      - "Confidence Scores"
      - "Model Metadata"

  # CSV
  csv:
    enabled: true
    utf8_bom: true

  # Database
  database:
    enabled: true
    type: "sqlite"
    name: "invoice_extractions_2026.db"

  # Output directory
  directory: "outputs"

# -----------------------------------------------------------------------------
# API CONFIGURATION
# -----------------------------------------------------------------------------
api:
  enabled: false
  host: "0.0.0.0"
  port: 8000
  workers: 4
  cors_origins: ["*"]
  max_upload_size: 52428800  # 50MB
  rate_limit: 100  # requests per minute

# -----------------------------------------------------------------------------
# INPUT HANDLING
# -----------------------------------------------------------------------------
input:
  supported_extensions:
    - ".pdf"
    - ".jpg"
    - ".jpeg"
    - ".png"
    - ".tiff"
    - ".tif"
    - ".bmp"
    - ".webp"
  pdf:
    dpi: 300
    first_page_only: false
    max_pages: 50
  image:
    target_dpi: 300
    max_width: 2480
    max_height: 3508
    min_width: 500
    min_height: 500
    auto_orient: true

# -----------------------------------------------------------------------------
# LOGGING
# -----------------------------------------------------------------------------
logging:
  level: "INFO"
  format: "%(asctime)s | %(levelname)-8s | %(name)s | %(message)s"
  date_format: "%Y-%m-%d %H:%M:%S"
  file:
    enabled: true
    path: "logs/extraction_2026.log"
    max_bytes: 10485760
    backup_count: 5
  console:
    enabled: true
    colorize: true

# -----------------------------------------------------------------------------
# PATHS
# -----------------------------------------------------------------------------
paths:
  input_dir: "data/input"
  output_dir: "outputs"
  temp_dir: "data/temp"
  logs_dir: "logs"
  models_cache: "models"
  vendor_db: "data/vendor_patterns.json"

# -----------------------------------------------------------------------------
# PERFORMANCE
# -----------------------------------------------------------------------------
performance:
  batch_size: 10
  max_workers: 4
  gpu_memory_limit: 8192  # MB
  cache_models: true
  timeout_per_page: 30  # seconds
